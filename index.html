<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scully: rebooking assistant (demo)</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<section id="landing" class="panel">
  <div class="avatar big">S</div>
  <h1>Flight cancelled?</h1>
  <p>Skip the wait. Scully starts rebooking you while you hold for an agent.</p>
  <button id="start" class="go">📞 Start call</button>
  <p class="note">Demo with mock data. Allow microphone access when asked.</p>
</section>
<section id="call" class="panel hide">
  <header><div class="avatar">S</div><div><b>Scully</b><div class="sub">Virtual assistant · <span id="timer">0:00</span> in queue</div></div><span class="live">● On call</span></header>
  <div id="caption" aria-live="polite"></div>
  <div id="heard"></div>
  <div id="cards"></div>
  <div id="hand"></div>
  <div id="chips"></div>
  <footer>
    <button id="mic" aria-label="Microphone">🎤<span id="mstat">Listening</span></button>
    <button id="end" aria-label="End call">End call</button>
  </footer>
  <form id="f"><input id="txt" placeholder="Prefer typing? Type here" autocomplete="off"><button>Send</button></form>
</section>
</main>
<script src="config.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
